name: FDIA Phase 1 tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  phase1-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Phase 1 test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov openpyxl pypdf
      - name: Run ingestion tests
        run: python -m pytest tests/unit/test_ingestion_phase1.py -q
