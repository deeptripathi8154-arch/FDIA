[project]
name = "fdia"
description = "Finance Document Intelligence Agent - Enterprise Monorepo"
version = "0.1.0"
authors = [{name = "FDIA Team"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Core Framework
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    
    # Desktop UI
    "flet>=0.22.0",
    
    # Automation & Web
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    
    # OCR & Vision
    "paddleocr>=2.7.0",
    "easyocr>=1.7.0",
    "pillow>=10.1.0",
    "opencv-python>=4.8.0",
    
    # AI & LLM
    "ollama>=0.1.0",
    
    # Excel
    "openpyxl>=3.11.0",
    "pypdf>=4.0.0",
    "pandas>=2.1.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "apscheduler>=3.10.0",
    "tenacity>=8.2.0",
    
    # Security
    "cryptography>=41.0.0",
    "passlib[bcrypt]>=1.7.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=packages --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B"]
